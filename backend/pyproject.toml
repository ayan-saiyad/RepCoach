[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "repcoach-backend"
version = "0.1.0"
description = "FastAPI API and asynchronous analysis worker for RepCoach"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2.0",
  "aiokafka>=0.11,<1.0",
  "asyncpg>=0.29,<1.0",
  "boto3>=1.35,<2.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "pgvector>=0.3,<1.0",
  "pydantic-settings>=2.4,<3.0",
  "redis>=5.0,<7.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.23,<1.0",
  "ruff>=0.6,<1.0"
]
ml = [
  "torch>=2.4,<3.0"
]
integrations = [
  "stripe>=11.0,<15.0",
  "twilio>=9.0,<11.0"
]

[tool.setuptools.packages.find]
include = ["app*", "worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
